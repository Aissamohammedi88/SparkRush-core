[package]
name = "sparkrush-editor"
version = "1.0.0"
edition = "2021"
authors = ["DGK <aissa.mohammedi@example>"]
description = "Native Rust text viewer + syntax highlighter + optimizer-agent hook (DGK x PROTON)"
license = "MIT"

[[bin]]
name = "sparkrush-editor"
path = "src/main.rs"

[profile.release]
opt-level = 2
lto = false
codegen-units = 1
strip = true
